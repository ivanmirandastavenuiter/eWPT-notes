# Metasploitable 2 target on a dedicated Docker network.
# Kali must be attached to the same network (pentest_net) to reach 172.20.0.2.
# If 172.20.0.0/16 clashes with an existing network, change the subnet and the
# ipv4_address together (check with: docker network ls / ip route).

services:
  meta2:
    image: tleemcjr/metasploitable2:latest
    container_name: meta2
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Starts the vulnerable services and keeps the container running.
    # tr strips CRs, in case the Windows checkout turned init.sh into CRLF.
    command: ["/bin/bash", "-c", "tr -d '\\r' < /init.sh > /tmp/init.sh && exec /bin/bash /tmp/init.sh"]
    volumes:
      - ./init.sh:/init.sh:ro
      - mysql_data:/var/lib/mysql
    networks:
      pentest_net:
        ipv4_address: 172.20.0.2

volumes:
  mysql_data:

networks:
  pentest_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
